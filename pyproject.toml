[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mg"
dynamic = ["version"]
dependencies = ["colorama", "matplotlib", "numpy", "pandas", "scipy", "tqdm"]
authors = [{ name = "Bradley Davis", email = "me@bradleydavis.tech" }]
requires-python = ">=3.12"

[project.urls]
Homepage = "https://github.com/WattsUp/mg-midget-ev"
Repository = "https://github.com/WattsUp/mg-midget-ev.git"
Issues = "https://github.com/WattsUp/mg-midget-ev/issues"

[project.optional-dependencies]
dev = [
  "ruff>=0.15.1",
  "codespell>=2.4.1",
  "black>=25.9",
  "isort",
  "pandas-stubs",
  "prek",
  "basedpyright>=1.38.0",
  "scipy-stubs",
  "taplo",
]

[tool.black]
target-version = ["py312", "py313"]
preview = true

[tool.codespell]
skip = "3rd-party,dist,*.pem,*.json"

[tool.isort]
profile = "black"
skip_gitignore = true
float_to_top = true
force_alphabetical_sort_within_sections = true

[tool.basedpyright]
include = ["mg", "tools"]
exclude = ["**/__pycache__", "typing"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"

reportUnknownParameterType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownLambdaType = "warning"
reportUnknownVariableType = "warning"
reportUnknownMemberType = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"

# Checked by ruff
reportPrivateUsage = "none"

[tool.ruff]
target-version = "py312"
exclude = ["typings"]

[tool.ruff.lint]
select = ["ALL"]
preview = true
future-annotations = true

ignore = [
  "line-contains-todo",                # Permit TODOs
  "unsorted-imports",                  # mismatch between ruff and isort
  "too-many-public-methods",           # Too many public methods
  "too-many-return-statements",        # Too many return statements
  "too-many-branches",                 # Too many branches
  "too-many-arguments",                # Too many arguments
  "too-many-locals",                   # Too many local variables
  "too-many-statements",               # Too many statements
  "too-many-positional-arguments",     # Too many positional arguments
  "missing-copyright-notice",          # No copyright
  "undocumented-public-package",       # Missing docstring in public package
  "incorrect-blank-line-before-class", # No blank line before pydocs
  "multi-line-summary-second-line",    # Summary on not on second line
  "print",                             # Allow print
]

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = true

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.ruff]
strictly-empty-init-modules = true

[tool.setuptools_scm]
version_file = "mg/version.py"

[tool.setuptools.packages.find]
include = ["mg*", "front_suspension*"]
